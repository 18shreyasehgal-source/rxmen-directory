<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RxMen Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F3;
    --surface:#FFFFFF;
    --ink:#16221D;
    --ink-soft:#5C6B62;
    --ink-faint:#8B978F;
    --line:#E1E5DD;
    --accent:#1F6E52;
    --accent-soft:#E4F0EA;
    --coral:#FF6B4A;
    --coral-soft:#FFEAE3;
    --radius-s:8px;
    --radius-m:12px;
    --maxw:1180px;
  }

  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,.display{font-family:'Space Grotesk',sans-serif;}

  /* Header */
  header{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(246,247,243,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:var(--maxw);
    margin:0 auto;
    padding:22px 24px 18px;
  }
  .brand-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .wordmark{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--ink);
  }
  .wordmark span{color:var(--accent);}
  .headline-sub{
    margin:4px 0 0;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .count-pill{
    font-size:13px;
    color:var(--accent);
    background:var(--accent-soft);
    padding:5px 12px;
    border-radius:100px;
    font-weight:600;
    white-space:nowrap;
  }

  .search-row{
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:10px;
  }
  .search-row svg{flex:none;color:var(--ink-faint);}
  #search{
    flex:1;
    border:none;
    background:transparent;
    outline:none;
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--ink);
    padding:2px 0;
  }
  #search::placeholder{color:var(--ink-faint);}
  #clearSearch{
    display:none;
    border:none;
    background:none;
    color:var(--ink-faint);
    cursor:pointer;
    font-size:13px;
    font-family:'Inter',sans-serif;
    padding:4px 6px;
  }
  #clearSearch:hover{color:var(--ink);}

  .chip-row{
    margin-top:14px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:500;
    padding:6px 13px;
    border-radius:100px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
    font-family:'Inter',sans-serif;
  }
  .chip:hover{border-color:var(--accent);color:var(--ink);}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  /* Main content */
  main{
    max-width:var(--maxw);
    margin:0 auto;
    padding:28px 24px 80px;
  }

  .dept-section{margin-bottom:38px;}
  .dept-heading{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin:0 0 14px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .dept-heading h2{
    font-size:16px;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }
  .dept-heading .dept-count{
    font-size:13px;
    color:var(--ink-faint);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
    gap:12px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:3px solid var(--dept-color,var(--accent));
    border-radius:var(--radius-s);
    padding:14px 15px;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .avatar{
    flex:none;
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:600;
    font-size:13px;
    background:var(--dept-color-soft,var(--accent-soft));
    color:var(--dept-color,var(--accent));
  }
  .card-body{min-width:0;flex:1;}
  .person-name{
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
    margin:0 0 1px;
    line-height:1.3;
    overflow-wrap:anywhere;
  }
  .person-role{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 9px;
    line-height:1.35;
  }
  .contact-line{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-decoration:none;
    padding:3px 0;
    border-radius:5px;
    overflow-wrap:anywhere;
  }
  .contact-line svg{flex:none;color:var(--ink-faint);}
  .contact-line:hover{color:var(--ink);}
  .contact-line:hover svg{color:var(--dept-color,var(--accent));}
  .copy-btn{
    margin-left:auto;
    flex:none;
    border:none;
    background:none;
    color:var(--ink-faint);
    cursor:pointer;
    padding:2px 4px;
    opacity:0;
    transition:opacity .12s ease;
  }
  .contact-line:hover .copy-btn{opacity:1;}
  .copy-btn:hover{color:var(--dept-color,var(--accent));}

  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-soft);
  }
  .empty-state .display{font-size:19px;color:var(--ink);margin-bottom:6px;}

  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(8px);
    background:var(--ink);
    color:#fff;
    font-size:13.5px;
    font-weight:500;
    padding:10px 18px;
    border-radius:100px;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 24px 40px;
    color:var(--ink-faint);
    font-size:12.5px;
  }


    /* Mobile-first touch improvements */
    html, body { width:100%; min-height:100%; overflow-x:hidden; }
    body { -webkit-text-size-adjust:100%; }
    button, input, a { -webkit-tap-highlight-color: transparent; }
    .chip, .copy-btn { min-height:40px; }
    .contact-line { min-height:40px; }
    @media (max-width: 600px){
      header{position:sticky;}
      .header-inner{padding:14px 14px 12px;}
      .brand-row{align-items:flex-start; gap:8px;}
      .wordmark{font-size:20px;}
      .headline-sub{font-size:13px; line-height:1.35; max-width:230px;}
      .count-pill{font-size:12px; padding:6px 10px;}
      .search-row{margin-top:14px; padding:7px 0 9px; gap:8px;}
      #search{font-size:16px; min-width:0;}
      #clearSearch{min-height:36px; padding:6px 8px;}
      .chip-row{flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; padding:2px 2px 7px; margin-top:10px; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
      .chip-row::-webkit-scrollbar{display:none;}
      .chip{flex:0 0 auto; font-size:12px; padding:8px 12px; min-height:38px; white-space:nowrap;}
      main{padding:18px 12px 55px;}
      .dept-section{margin-bottom:28px;}
      .dept-heading{margin-bottom:10px; padding-bottom:7px;}
      .dept-heading h2{font-size:15px;}
      .grid{grid-template-columns:1fr; gap:9px;}
      .card{padding:12px 12px; gap:10px; border-left-width:3px; border-radius:10px;}
      .avatar{width:40px; height:40px; font-size:12px;}
      .person-name{font-size:14px;}
      .person-role{font-size:12px; margin-bottom:5px;}
      .contact-line{font-size:12px; min-height:38px; padding:5px 0;}
      .copy-btn{opacity:1; min-width:34px; min-height:34px; padding:7px;}
      footer{padding:0 14px 30px; font-size:11.5px; line-height:1.45;}
      .toast{bottom:18px; max-width:calc(100vw - 32px); text-align:center;}
    }
    @media (max-width:360px){
      .header-inner{padding-left:12px; padding-right:12px;}
      main{padding-left:10px; padding-right:10px;}
      .wordmark{font-size:18px;}
      .headline-sub{font-size:12px; max-width:190px;}
      .count-pill{font-size:11px; padding:5px 8px;}
    }

  @media (max-width:480px){
    .header-inner{padding:18px 16px 14px;}
    main{padding:22px 16px 60px;}
    .wordmark{font-size:19px;}
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>

  function buildChips(){
    chipRow.innerHTML = "";

        activeDept = d;
        render();
      });
      chipRow.appendChild(btn);
    });
  }

  function initials(name){
    const parts = name.trim().split(/\s+/).filter(Boolean);
    if(parts.length === 0) return "?";
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }

  function formatPhone(phone){
    const digits = phone.replace(/\D/g,'');
    if(digits.length === 10) return digits.slice(0,5) + ' ' + digits.slice(5);
    return phone;
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function copyToClipboard(text, label){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => showToast(label + " copied")).catch(() => fallbackCopy(text, label));
    } else {
      fallbackCopy(text, label);
    }
  }
  function fallbackCopy(text, label){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast(label + " copied"); } catch(e){}
    document.body.removeChild(ta);
  }

  const phoneIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
  const mailIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6c0-1.1-.9-2-2-2H4a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V6z"/><path d="M22 6l-10 7L2 6"/></svg>';
  const copyIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

  function personCard(p){
    const colors = DEPT_COLORS[p.dept] || {c:"#1F6E52", s:"#E4F0EA"};
    const card = document.createElement('div');
    card.className = 'card';
    card.style.setProperty('--dept-color', colors.c);
    card.style.setProperty('--dept-color-soft', colors.s);

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = initials(p.name);

    const body = document.createElement('div');
    body.className = 'card-body';

    const nameEl = document.createElement('p');
    nameEl.className = 'person-name';
    nameEl.textContent = p.name;

    const roleEl = document.createElement('p');
    roleEl.className = 'person-role';
    roleEl.textContent = p.role || p.dept;

    body.appendChild(nameEl);
    body.appendChild(roleEl);

    if(p.phone){
      const line = document.createElement('a');
      line.className = 'contact-line';
      const rawPhone = String(p.phone || '').trim();
       const phoneDigits = rawPhone.replace(/\D/g,'');
       line.href = rawPhone.startsWith('+') ? 'tel:+' + phoneDigits : 'tel:+91' + phoneDigits;
      line.innerHTML = phoneIcon + '<span>' + formatPhone(p.phone) + '</span>';
      const cbtn = document.createElement('button');
      cbtn.className = 'copy-btn';
      cbtn.type = 'button';
      cbtn.innerHTML = copyIcon;
      cbtn.title = 'Copy number';
      cbtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); copyToClipboard(p.phone, 'Number'); });
      line.appendChild(cbtn);
      body.appendChild(line);
    }

    if(p.email){
      const line = document.createElement('a');
      line.className = 'contact-line';
      line.href = 'mailto:' + p.email;
      line.innerHTML = mailIcon + '<span>' + p.email + '</span>';
      const cbtn = document.createElement('button');
      cbtn.className = 'copy-btn';
      cbtn.type = 'button';
      cbtn.innerHTML = copyIcon;
      cbtn.title = 'Copy email';
      cbtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); copyToClipboard(p.email, 'Email'); });
      line.appendChild(cbtn);
      body.appendChild(line);
    }

    card.appendChild(avatar);
    card.appendChild(body);
    return card;
  }

  function matches(p, q){
    if(!q) return true;
    const hay = (p.name + ' ' + p.role + ' ' + p.dept).toLowerCase();
    return hay.includes(q);
  }

  function render(){
    buildChips();
    mainEl.innerHTML = "";
    const q = searchInput.value.trim().toLowerCase();
    clearBtn.style.display = q ? 'block' : 'none';

    let pool = PEOPLE.filter(p => matches(p, q));
    if(activeDept !== "All"){
      pool = pool.filter(p => p.dept === activeDept);
    }

    if(pool.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<p class="display">No one matches that</p><p>Try a different name, role or team.</p>';
      mainEl.appendChild(empty);
      return;
    }

    if(q || activeDept !== "All"){
      // flat grid, grouped only if a single dept is implied by filter chip already
      const grid = document.createElement('div');
      grid.className = 'grid';
      pool.forEach(p => grid.appendChild(personCard(p)));
      mainEl.appendChild(grid);
      return;
    }

    // grouped by department, in fixed order
    depts.forEach(d => {
      const group = pool.filter(p => p.dept === d);
      if(group.length === 0) return;
      const section = document.createElement('section');
      section.className = 'dept-section';

      const heading = document.createElement('div');
      heading.className = 'dept-heading';
      heading.innerHTML = `<h2>${d}</h2><span class="dept-count">${group.length}</span>`;
      section.appendChild(heading);

      const grid = document.createElement('div');
      grid.className = 'grid';
      group.forEach(p => grid.appendChild(personCard(p)));
      section.appendChild(grid);

      mainEl.appendChild(section);
    });
  }

  searchInput.addEventListener('input', render);
  clearBtn.addEventListener('click', () => { searchInput.value = ''; render(); searchInput.focus(); });

  render();
})();
</script>
</body>
</html>
